<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Space Game</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: black;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
      }

      canvas {
        border: 4px solid #c084fc;
        box-shadow:
          0 0 10px #c084fc,
          0 0 30px #c084fc;
        background: black;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      canvas.width = 500;
      canvas.height = 700;

      const keys = {};

      document.addEventListener("keydown", (e) => {
        keys[e.key] = true;
      });

      document.addEventListener("keyup", (e) => {
        keys[e.key] = false;
      });

      const player = {
        x: 230,
        y: 620,
        size: 8,
        speed: 5,

        hp: 100,
        maxHp: 100,
      };

      const bullets = [];
      const enemies = [];
      const stars = [];

      let score = 0;
      let gameOver = false;

      for (let i = 0; i < 100; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 3,
        });
      }

      function createEnemy() {
        if (gameOver) return;

        enemies.push({
          x: Math.random() * 440,
          y: -30,
          speed: 2 + Math.random() * 2,
        });
      }

      setInterval(createEnemy, 1000);

      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" && !gameOver) {
          bullets.push({
            x: player.x + 10,
            y: player.y,
            width: 4,
            height: 12,
          });
        }
      });

      function drawPixelShip(x, y, color) {
        const pixels = [
          [0, 1, 0],
          [1, 1, 1],
          [1, 1, 1],
          [1, 0, 1],
        ];

        ctx.shadowColor = color;
        ctx.shadowBlur = 20;

        for (let row = 0; row < pixels.length; row++) {
          for (let col = 0; col < pixels[row].length; col++) {
            if (pixels[row][col] === 1) {
              ctx.fillStyle = color;

              ctx.fillRect(
                x + col * player.size,
                y + row * player.size,
                player.size - 1,
                player.size - 1,
              );
            }
          }
        }

        ctx.shadowBlur = 0;
      }

      function drawEnemy(x, y) {
        const pixels = [
          [1, 0, 1],
          [1, 1, 1],
          [0, 1, 0],
        ];

        ctx.shadowColor = "#c084fc";
        ctx.shadowBlur = 20;

        for (let row = 0; row < pixels.length; row++) {
          for (let col = 0; col < pixels[row].length; col++) {
            if (pixels[row][col] === 1) {
              ctx.fillStyle = "#c084fc";

              ctx.fillRect(x + col * 8, y + row * 8, 7, 7);
            }
          }
        }

        ctx.shadowBlur = 0;
      }

      function update() {
        if (gameOver) return;

        // movement
        if (keys["ArrowLeft"]) {
          player.x -= player.speed;
        }

        if (keys["ArrowRight"]) {
          player.x += player.speed;
        }

        if (keys["ArrowUp"]) {
          player.y -= player.speed;
        }

        if (keys["ArrowDown"]) {
          player.y += player.speed;
        }

        // giới hạn map
        player.x = Math.max(0, Math.min(canvas.width - 30, player.x));
        player.y = Math.max(0, Math.min(canvas.height - 40, player.y));

        // bullets
        bullets.forEach((bullet, index) => {
          bullet.y -= 8;

          if (bullet.y < 0) {
            bullets.splice(index, 1);
          }
        });

        // enemies
        enemies.forEach((enemy, eIndex) => {
          enemy.y += enemy.speed;

          if (enemy.y > canvas.height) {
            enemies.splice(eIndex, 1);
          }

          // enemy hit player
          if (
            player.x < enemy.x + 24 &&
            player.x + 24 > enemy.x &&
            player.y < enemy.y + 24 &&
            player.y + 24 > enemy.y
          ) {
            enemies.splice(eIndex, 1);

            player.hp -= 20;

            if (player.hp <= 0) {
              gameOver = true;
            }
          }

          // bullet hit enemy
          bullets.forEach((bullet, bIndex) => {
            if (
              bullet.x < enemy.x + 24 &&
              bullet.x + bullet.width > enemy.x &&
              bullet.y < enemy.y + 24 &&
              bullet.y + bullet.height > enemy.y
            ) {
              enemies.splice(eIndex, 1);
              bullets.splice(bIndex, 1);

              score += 10;
            }
          });
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // stars
        stars.forEach((star) => {
          ctx.fillStyle = "white";

          ctx.fillRect(star.x, star.y, star.size, star.size);
        });

        // player
        drawPixelShip(player.x, player.y, "cyan");

        // bullets
        bullets.forEach((bullet) => {
          ctx.fillStyle = "white";

          ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
        });

        // enemies
        enemies.forEach((enemy) => {
          drawEnemy(enemy.x, enemy.y);
        });

        // score
        ctx.fillStyle = "white";
        ctx.font = "24px Arial";

        ctx.fillText("Score: " + score, 20, 40);

        // hp
        ctx.fillText("HP", 350, 40);

        ctx.strokeStyle = "white";

        ctx.strokeRect(390, 20, 80, 20);

        ctx.fillStyle = "lime";

        ctx.fillRect(390, 20, (player.hp / player.maxHp) * 80, 20);

        // game over
        if (gameOver) {
          ctx.fillStyle = "rgba(0,0,0,0.7)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = "red";
          ctx.font = "50px Arial";

          ctx.fillText("GAME OVER", 90, 300);

          // restart button
          ctx.shadowColor = "#c084fc";
          ctx.shadowBlur = 20;

          ctx.fillStyle = "#c084fc";

          ctx.fillRect(170, 380, 160, 60);

          ctx.shadowBlur = 0;

          ctx.fillStyle = "white";
          ctx.font = "30px Arial";

          ctx.fillText("RESTART", 185, 420);
        }
      }

      function restartGame() {
        score = 0;

        player.hp = 100;

        player.x = 230;
        player.y = 620;

        bullets.length = 0;
        enemies.length = 0;

        gameOver = false;
      }

      canvas.addEventListener("click", (e) => {
        if (!gameOver) return;

        const rect = canvas.getBoundingClientRect();

        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (mouseX >= 170 && mouseX <= 330 && mouseY >= 380 && mouseY <= 440) {
          restartGame();
        }
      });

      function gameLoop() {
        update();
        draw();

        requestAnimationFrame(gameLoop);
      }

      gameLoop();
    </script>
  </body>
</html>
